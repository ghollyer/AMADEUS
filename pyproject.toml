[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus"
version = "1.0.0"
description = "Addressable Microscope And Detector Experiment Unified Scripting"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",          # streamable HTTP (amadeus-web /mcp); brings starlette, uvicorn, sse-starlette
    "pyzmq>=25.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
amadeus-server = "client.server:main"
amadeus-console = "client.operator_console:main"
amadeus-relay = "relay.server:main"
amadeus-setup = "setup_wizard.wizard:main"
amadeus-launcher = "setup_wizard.launcher:main"
amadeus-check = "client.diagnostics:main"
amadeus-web = "client.web.app:main"
amadeus-driver-test = "drivers.contract:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "dm_server*", "common*", "relay*", "drivers*",
           "setup_wizard*"]

[tool.setuptools.package-data]
"client.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
